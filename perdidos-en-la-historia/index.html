<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Perdidos en la Historia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Cinzel:wght@800;900&display=swap">
<style>
/* Concepto: una sola columna de juego, oscura como una vitrina, con cada sala en su color y una banda de teselas como firma. */
:root{
  color-scheme:dark;
  --night:#14100c; --ink:#1f1913; --line:rgba(255,240,214,.16); --bone:#f6ecd9; --muted:#b9ab94;
  --amber:#d4920f; --amber-hi:#f0b63a; --room:#2a1a0c; --panel:#3a2813;
  --ok:#4e9d3d; --bad:#d4403a;
  --t1:#009797; --t2:#c3d66a; --t3:#f7a623; --t4:#746b89; --t5:#d43b3d; --t6:#6ebe4e;
  --display:Cinzel,"Times New Roman",serif; --cond:"Barlow Condensed","Arial Narrow",sans-serif; --body:Barlow,system-ui,sans-serif;
  --g:max(20px,env(safe-area-inset-left,0px)); --gr:max(20px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--bone);font:500 16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button,input{font:inherit;color:inherit}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
ul,ol{list-style:none}
#app{--room:#2a1a0c;--panel:#3a2813;max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--room);transition:background .35s}
#app.red{--room:#3f0606;--panel:#5a1a18}
#app.blue{--room:#0d0834;--panel:#221d55}
#app.gold{--room:#3a2607;--panel:#5a3c0d}
.tess{height:6px;flex:none;background:repeating-linear-gradient(90deg,var(--t3) 0 12px,var(--night) 12px 14px,var(--t4) 14px 26px,var(--night) 26px 28px,var(--t2) 28px 40px,var(--night) 40px 42px,var(--t1) 42px 54px,var(--night) 54px 56px)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;flex:none;background:var(--night);display:flex;align-items:center;gap:12px;padding:10px var(--gr) 10px var(--g);border-bottom:1px solid var(--line)}
.bar img{width:40px;height:34px;display:block;flex:none}
.bar b{font:700 13px/1.1 var(--cond);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);flex:1;min-width:0}
.bar span{font:800 18px/1 var(--cond);font-variant-numeric:tabular-nums;color:var(--amber-hi);flex:none}
main{flex:1 0 auto;display:flex;flex-direction:column;padding:26px var(--gr) 26px var(--g);gap:20px}
.eyebrow{font:700 14px/1.1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--amber-hi)}
h1.t,h2.t{font:800 clamp(30px,8.6vw,38px)/1.02 var(--cond);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.lead{color:var(--muted);font-size:17px}
.cta{display:block;width:100%;min-height:56px;border:0;border-radius:6px;background:var(--amber-hi);color:#20140a;font:800 21px/1 var(--cond);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:transform .12s,background .15s}
.cta:hover:not(:disabled){background:#ffc957}
.cta:active:not(:disabled){transform:translateY(1px)}
.cta:disabled{background:rgba(255,240,214,.13);color:var(--muted);cursor:not-allowed}
.ghost{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px;font-size:15px}
:focus-visible{outline:3px solid var(--bone);outline-offset:2px}
.push{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.hint{text-align:center;color:var(--muted);font-size:14px}

/* Audio */
.play{position:sticky;bottom:env(safe-area-inset-bottom,0px);z-index:5;flex:none;background:var(--night);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:13px var(--gr) 13px var(--g)}
.snd{width:40px;height:40px;flex:none;display:grid;place-items:center;background:none;border:1px solid var(--line);border-radius:6px;color:var(--bone);cursor:pointer;padding:0}
.pp{width:50px;height:50px;border-radius:50%;border:0;background:var(--bone);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.pp svg{width:20px;height:20px;fill:var(--night)}
.wave{flex:1;min-width:0;height:46px;display:flex;align-items:center;gap:2px;cursor:pointer;touch-action:none}
.wave i{flex:1;min-width:1px;background:rgba(255,240,214,.28);border-radius:1px;transition:background .1s}
.wave i.on{background:var(--amber-hi)}
.time{font:700 15px/1 var(--cond);color:var(--muted);flex:none;width:34px;text-align:right;font-variant-numeric:tabular-nums}
.say{min-height:120px;display:flex;align-items:center;font:700 clamp(26px,7vw,31px)/1.2 var(--body);text-wrap:balance}
.lyr-head{display:flex;justify-content:space-between;align-items:center}
.size{border:1px solid var(--line);background:none;border-radius:6px;min-width:48px;height:40px;font:700 16px/1 var(--body);cursor:pointer}
.lyr{position:relative;flex:1 1 auto;height:clamp(240px,48vh,520px);overflow-y:auto;display:flex;flex-direction:column;align-items:stretch;gap:6px;scrollbar-width:none;padding-bottom:30vh;--ly:29px}
.lyr::-webkit-scrollbar{display:none}
.lyr.s2{--ly:35px}.lyr.s3{--ly:42px}
.ln{display:block;width:100%;background:none;border:0;padding:5px 0;text-align:left;font:700 var(--ly)/1.18 var(--body);color:rgba(246,236,217,.42);cursor:pointer;transition:color .18s}
.ln.past{color:rgba(246,236,217,.62)}
.ln.now{color:#fff}
.ln.cue{font-style:italic;font-weight:600;color:rgba(240,182,58,.65)}
.ln.cue.now{color:var(--amber-hi)}
.lyr.empty{height:auto;padding:0;flex:none;color:var(--muted);font-size:17px}
.steps{display:flex;gap:3px}
.steps i{flex:1;height:5px;background:rgba(255,240,214,.16)}
.steps i.on{background:var(--amber-hi)}
.num{font:900 clamp(96px,30vw,136px)/.9 var(--display);color:var(--amber-hi)}
.stop{justify-content:flex-start}
.listen{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:15px}

/* Portada */
.cover{justify-content:space-between;padding-top:40px;gap:30px}
.brand{font:900 clamp(50px,14.6vw,70px)/.98 var(--display);color:var(--bone)}
.brand em{font-style:normal;color:var(--amber-hi);display:block;font-size:.52em;line-height:1.3}
.foot{flex:none;background:#6b3b00;color:var(--bone);padding:22px var(--gr) 26px var(--g);display:flex;gap:16px;justify-content:space-between;align-items:flex-end;color:var(--muted);font-size:13px;line-height:1.45}
.foot a{color:var(--bone)}
.foot img{width:110px;height:auto;flex:none;border-radius:3px}

/* Registro */
.field label{display:block;font:700 15px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.field input{width:100%;height:54px;border:1px solid var(--line);border-radius:6px;background:rgba(255,240,214,.08);padding:0 14px;font-size:17px}
.field input:focus{outline:2px solid var(--amber-hi);outline-offset:0;border-color:transparent}
.fields{display:flex;flex-direction:column;gap:16px}
.cast{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.who{cursor:pointer;display:grid;place-items:center}
.who input{position:absolute;opacity:0;width:0;height:0}
.who img{width:min(88px,100%);height:auto;border-radius:50%;display:block;transition:transform .16s,box-shadow .16s}
.who:hover img{transform:scale(1.07)}
.who input:checked+img{box-shadow:0 0 0 3px var(--room),0 0 0 6px var(--amber-hi);transform:scale(1.04)}
.who input:focus-visible+img{outline:3px solid var(--bone);outline-offset:7px}
.err{color:#ffb3a8;font-weight:600;text-align:center}
.nfc{align-self:center;width:180px;height:180px;border:0;border-radius:50%;background:radial-gradient(circle,var(--amber-hi) 0 26%,transparent 27%),repeating-radial-gradient(circle,transparent 0 20px,rgba(240,182,58,.35) 20px 22px);display:block}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>h2{font:800 22px/1.1 var(--cond);text-transform:uppercase}

/* Misión y prueba */
.frame{align-self:center;max-width:100%;padding:8px;background:var(--panel);display:block}
.frame img{display:block;height:min(32vh,230px);width:auto;max-width:100%;object-fit:contain}
.timer{height:8px;background:rgba(255,240,214,.16);position:sticky;top:calc(55px + env(safe-area-inset-top,0px));z-index:5;flex:none}
.timer i{display:block;height:100%;background:var(--amber-hi);transform-origin:left;width:100%}
.timer.low i{background:var(--bad)}
.q-top{display:flex;justify-content:space-between;align-items:baseline}
.sec-left{font:800 34px/1 var(--cond);font-variant-numeric:tabular-nums}
.q{font:800 25px/1.08 var(--cond);text-transform:uppercase;text-wrap:balance}
.q-frame img{height:min(22vh,150px)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{width:100%;min-height:56px;display:flex;align-items:center;gap:13px;text-align:left;border:1px solid var(--line);border-radius:6px;background:rgba(255,240,214,.08);padding:9px 14px;font-weight:600;font-size:17px;line-height:1.2;cursor:pointer;transition:background .13s,border-color .13s}
.opt:hover:not(:disabled){background:rgba(255,240,214,.2);border-color:var(--bone)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.5}
.mk{width:18px;height:18px;flex:none;display:block}
.m0{background:var(--t3);border-radius:0 8px 0 4px}.m1{background:var(--t4);border-radius:4px}.m2{background:var(--t2);border-radius:50%}.m3{background:var(--t1)}

/* Respuesta */
.verdict{font:800 clamp(42px,12vw,54px)/.95 var(--cond);text-transform:uppercase}
.verdict.no{color:#ff9a8f}.verdict.yes{color:#a6e08f}
.answer{display:flex;gap:12px;align-items:flex-start;background:var(--panel);padding:15px;font:700 19px/1.2 var(--body)}
.answer .mk{margin-top:2px}
.why{font-size:18px;line-height:1.5;color:var(--bone)}
.pts{font:800 22px/1 var(--cond);color:var(--amber-hi)}

/* Ranking */
.pod{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:6px;align-items:end;height:280px}
.pod>div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;height:100%}
.pod b{font:800 34px/1 var(--cond);margin-bottom:6px}
.pod i{display:block;width:100%;animation:rise .55s ease-out both}
.pod span{font:700 16px/1.1 var(--cond);margin-top:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod small{font:600 14px/1 var(--cond);color:var(--muted);margin-top:3px}
@keyframes rise{from{transform:scaleY(.15);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.rest{display:flex;flex-direction:column;gap:7px}
.rest li{display:flex;align-items:center;gap:11px;font:700 19px/1 var(--cond)}
.rest em{font-style:normal;width:14px;color:var(--muted)}
.rest span{flex:1;min-width:0;padding:9px 12px;color:#fff;display:flex;justify-content:space-between;gap:8px}
.me{outline:2px solid var(--bone);outline-offset:1px}
.me-t{text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

function mountAudio(n,{onEnd,auto,noSkip}){
  const pp=$('pp'),wv=$('wv'),tm=$('tm'),ly=$('lyr'),bars=[...wv.children];let raf=0,max=0,cur=-2;const subs=SUBS[n]||[];

  audio.pause();audio.src=`assets/audio/${String(n).padStart(2,'0')}.mp3`;audio.load();
  const icon=()=>{const p=!audio.paused;pp.innerHTML=p?ICON.pause:ICON.play;pp.setAttribute('aria-label',p?'Pausar':'Reproducir')};
  function paint(){const d=audio.duration||1,f=audio.currentTime/d,k=Math.round(f*bars.length);max=Math.max(max,audio.currentTime);
    bars.forEach((b,i)=>b.classList.toggle('on',i<k));tm.textContent=fmt(audio.currentTime);
    if(lines.length){let k2=-1;subs.forEach(([t],i)=>{if(audio.currentTime>=t)k2=i});if(k2!==cur){cur=k2;lines.forEach((l,i)=>{l.classList.toggle('past',i<k2);l.classList.toggle('now',i===k2)});if(k2>=0)ly.scrollTo({top:Math.max(0,lines[k2].offsetTop-ly.clientHeight*.3),behavior:calm?'auto':'smooth'})}}}
  function loop(){paint();if(!audio.paused)raf=requestAnimationFrame(loop)}
  const start=()=>audio.play().then(()=>{gesture=true;icon();loop()}).catch(()=>icon());
  pp.onclick=()=>{if(audio.paused)start();else{audio.pause();icon()}};
  audio.onended=()=>{icon();paint();onEnd&&onEnd()};
  audio.onerror=()=>{tm.textContent='Error'};
  audio.onloadedmetadata=paint;
  lines.forEach((l,i)=>l.onclick=()=>{let t=subs[i][0];if(noSkip&&t>max)return;audio.currentTime=t;paint();if(audio.paused)start()});
  const sb=$('size');if(sb){const set=v=>{ly.classList.remove('s2','s3');if(v>1)ly.classList.add('s'+v);sb.setAttribute('aria-label','Tamaño del texto '+v+' de 3');try{localStorage.setItem('peh-size',v)}catch(e){}};let v=1;try{v=+localStorage.getItem('peh-size')||1}catch(e){}set(v);sb.onclick=()=>{v=v%3+1;set(v)}}
  const seek=x=>{const r=wv.getBoundingClientRect(),d=audio.duration||0;let t=Math.max(0,Math.min(1,(x-r.left)/r.width))*d;if(noSkip)t=Math.min(t,max);audio.currentTime=t;paint()};
  wv.onpointerdown=e=>{wv.setPointerCapture(e.pointerId);seek(e.clientX);wv.onpointermove=m=>seek(m.clientX)};

  wv.onkeydown=e=>{if(e.key==='ArrowLeft')audio.currentTime=Math.max(0,audio.currentTime-5);else if(e.key==='ArrowRight'&&!noSkip)audio.currentTime=Math.min(audio.duration||0,audio.currentTime+5);paint()};
  icon();if(auto&&gesture)start();
  return()=>{audio.pause();cancelAnimationFrame(raf);audio.onended=audio.onerror=audio.onloadedmetadata=null};
}

  ${SUBS[n]?`<div class="lyr-head"><p class="eyebrow">Audio ${n}</p><button class="size" id="size">Aa</button></div><div class="lyr" id="lyr"></div>`:`<p class="num">${String(n).padStart(2,'0')}</p><div class="lyr empty" id="lyr">La transcripción de este audio estará disponible pronto.</div>`}
  <div class="push"><button class="cta" id="go">${n<17?'Siguiente audio':'Ir a la primera misión'}</button></div></main>${playerHTML(n)}`;
  $('go').onclick=()=>go(n<17?'audio-'+(n+1):'mision-1');
  return mountAudio(n,{auto:true,onEnd:()=>{if(n<17)$('go').focus({preventScroll:true})}});
 },
 mision(i){
  const m=MISSIONS[i];app.className=m.room;
  app.innerHTML=bar(`Misión ${m.n} de VI · Sala ${m.room==='red'?'roja':'azul'}`)+`<main><div><p class="eyebrow">Misión ${m.n}</p><h1 class="t">${m.go}</h1></div><figure class="frame" style="margin:0"><img src="assets/${m.img}.png" alt=""></figure><p class="lead">Cuando la tengas delante, empieza la prueba. Tendrás ${LIMIT} segundos para responder.</p><div class="push"><button class="cta" id="go">Empezar misión ${m.n}</button></div></main>`;
  $('go').onclick=()=>go('prueba-'+(i+1));
 },
 prueba(i){
  const m=MISSIONS[i],prev=S.ans[i];app.className=m.room;
  app.innerHTML=bar(`Misión ${m.n} de VI`)+`<div class="timer" id="tb"><i id="ti"></i></div><main><div class="q-top"><p class="eyebrow">Pregunta</p><p class="sec-left" id="sl" aria-live="off">${LIMIT}</p></div><figure class="frame q-frame" style="margin:0"><img src="assets/${m.img}.png" alt=""></figure><h1 class="q">${m.q}</h1><div class="opts">${m.o.map((t,j)=>`<button class="opt" data-j="${j}"><i class="mk m${j}"></i><span>${t}</span></button>`).join('')}</div><div class="push"><button class="cta" id="go" disabled>Ver respuesta</button></div></main>`;
  const bs=[...app.querySelectorAll('.opt')],t0=performance.now();let raf=0,done=false,lastS=99;setMode('test');
  function mark(j){done=true;cancelAnimationFrame(raf);bs.forEach((b,k)=>{b.disabled=true;if(k===m.a)b.classList.add('ok');else if(k===j)b.classList.add('bad');else b.classList.add('dim')});$('go').disabled=false;$('tb').hidden=true}
  function tick(){const left=LIMIT-(performance.now()-t0)/1000;if(left<=0){S.ans[i]={j:-1,pts:0};save();$('sl').textContent='0';mark(-1);play('timeup');return}
   {const c=Math.ceil(left);if(c!==lastS){lastS=c;if(c<=5)play('tick')}}
   $('ti').style.transform=`scaleX(${left/LIMIT})`;$('sl').textContent=Math.ceil(left);$('tb').classList.toggle('low',left<=5);raf=requestAnimationFrame(tick)}
  if(prev){mark(prev.j);$('sl').textContent=''}else raf=requestAnimationFrame(tick);
  bs.forEach(b=>b.onclick=()=>{if(done)return;const j=+b.dataset.j,left=Math.max(0,LIMIT-(performance.now()-t0)/1000);S.ans[i]={j,pts:j===m.a?100+Math.round(50*left/LIMIT):0};save();mark(j);play(j===m.a?'ok':'bad')});
  $('go').onclick=()=>go('respuesta-'+(i+1));
  return()=>{cancelAnimationFrame(raf);setMode('roman')};
 },
 respuesta(i){
  const m=MISSIONS[i],a=S.ans[i]||{j:-2,pts:0},ok=a.j===m.a;app.className=m.room;
  const label=i===2?'Terminar fase I':i===5?'Ver resultados':'Siguiente misión';
  app.innerHTML=bar(`Misión ${m.n} de VI`)+`<main><div><p class="verdict ${ok?'yes':'no'}">${ok?'¡Correcto!':a.j===-1?'Se acabó el tiempo':'Casi'}</p><p class="pts" style="margin-top:8px">${ok?'+'+a.pts+' puntos':'0 puntos'}</p></div><div class="answer"><i class="mk m${m.a}"></i><span>${m.o[m.a]}</span></div><p class="why">${m.why}</p><div class="push"><button class="cta" id="go">${label}</button></div></main>`;
  $('go').onclick=()=>go(i===2?'ranking-1':i===5?'ranking-2':'mision-'+(i+2));
 },
 ranking(f){
  app.className='gold';
  const me=(S.name||'Tú').toUpperCase(),pts=f==1?Object.entries(S.ans).filter(([x])=>+x<3).reduce((s,[,v])=>s+v.pts,0):score();
  const l=RIVALS.filter(r=>r[0]!==me).slice(0,5).map(r=>({n:r[0],p:f==1?r[1]:r[1]+r[2]}));l.push({n:me,p:pts,me:true});l.sort((a,b)=>b.p-a.p);
  const col=['--t1','--t2','--t3','--t4','--t5','--t6'],h=[200,132,96];
  const cell=i=>`<div><b>#${i+1}</b><i class="${l[i].me?'me':''}" style="height:${h[i]}px;background:var(${col[i]})"></i><span class="${l[i].me?'me-t':''}">${esc(l[i].n)}</span><small>${l[i].p}</small></div>`;
  app.innerHTML=bar(f==1?'Fin de la fase I':'Fin del juego')+`<main><div><p class="eyebrow">${f==1?'Sala roja':'Clasificación final'}</p><h1 class="t">${f==1?'Resultados de la primera fase':'Resultados finales'}</h1></div><div class="pod">${[2,0,1].map(cell).join('')}</div><ol class="rest" start="4">${l.slice(3).map((r,k)=>`<li><em>${k+4}</em><span class="${r.me?'me':''}" style="background:var(${col[k+3]})"><span style="padding:0;flex:1;min-width:0">${esc(r.n)}</span><span style="padding:0;flex:none">${r.p}</span></span></li>`).join('')}</ol><div class="push"><button class="cta" id="go">${f==1?'Siguiente fase':'Volver a empezar'}</button></div></main>`;
  play(l.findIndex(x=>x.me)===0?'win':'rank');
  $('go').onclick=()=>{if(f==1)go('mision-4');else{S=fresh();save();go('inicio')}};
 }
};
/* Sonido del juego: música y efectos sintetizados, sin archivos. No afecta a la narración. */
const A={ctx:null,on:true,mode:'roman',ducked:false,i:0,next:0};
try{A.on=localStorage.getItem('peh-snd')!=='0'}catch(e){}
const SPK=on=>`<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9z"/>${on?'<path d="M15 8.5a5 5 0 0 1 0 7l-1.2-1.2a3.3 3.3 0 0 0 0-4.6zM17.6 6a8.6 8.6 0 0 1 0 12l-1.2-1.2a6.9 6.9 0 0 0 0-9.6z"/>':'<path d="M15.3 9.3l1.2-1.2 2.2 2.2 2.2-2.2 1.2 1.2-2.2 2.2 2.2 2.2-1.2 1.2-2.2-2.2-2.2 2.2-1.2-1.2 2.2-2.2z"/>'}</svg>`;
const sndBtn=()=>`<button class="snd" id="snd" aria-pressed="${A.on}" aria-label="Música y efectos">${SPK(A.on)}</button>`;
function musicLevel(){if(!A.ctx)return;const v=A.ducked?.02:A.mode==='test'?.2:.34;A.music.gain.setTargetAtTime(v,A.ctx.currentTime,.3);A.dr.gain.setTargetAtTime(A.mode==='test'?1:0,A.ctx.currentTime,.4)}
function boot(){
  if(A.ctx){if(A.ctx.state==='suspended')A.ctx.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=A.ctx=new C();
  A.master=c.createGain();A.master.gain.value=A.on?1:0;
  const comp=c.createDynamicsCompressor();A.master.connect(comp);comp.connect(c.destination);
  A.music=c.createGain();A.music.gain.value=0;A.music.connect(A.master);
  A.sfx=c.createGain();A.sfx.gain.value=.5;A.sfx.connect(A.master);
  A.bus=c.createGain();A.bus.connect(A.music);A.dr=c.createGain();A.dr.gain.value=0;A.dr.connect(A.bus);
  const nb=c.createBuffer(1,c.sampleRate*.25,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;A.noise=nb;
  const d=c.createDelay(1),fb=c.createGain(),lp=c.createBiquadFilter();d.delayTime.value=.42;fb.gain.value=.36;lp.type='lowpass';lp.frequency.value=1700;
  A.bus.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(A.music);
  [[73.42,.34],[110,.16],[146.83,.07]].forEach(([f,v],k)=>{const o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();o.frequency.value=f;g.gain.value=v;l.frequency.value=.07+k*.04;lg.gain.value=v*.4;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(A.dr);o.start();l.start()});
  A.next=c.currentTime+.15;setInterval(sched,100);musicLevel();
}
const hz=m=>440*Math.pow(2,(m-69)/12);
function pluck(t,m,v){const c=A.ctx,o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='triangle';o.frequency.value=hz(m);f.type='lowpass';f.frequency.setValueAtTime(2600,t);f.frequency.exponentialRampToValueAtTime(500,t+1.1);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+1.5);o.connect(f);f.connect(g);g.connect(A.bus);o.start(t);o.stop(t+1.6)}
function drum(t,v){const c=A.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(115,t);o.frequency.exponentialRampToValueAtTime(52,t+.16);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(g);g.connect(A.bus);o.start(t);o.stop(t+.3)}
function tap(t,v){const c=A.ctx,n=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();n.buffer=A.noise;f.type='bandpass';f.frequency.value=1500;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);n.connect(f);f.connect(g);g.connect(A.bus);n.start(t);n.stop(t+.14)}
function brass(t,notes,d,v){const c=A.ctx;notes.forEach(m=>[-5,5].forEach(cents=>{const o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o.frequency.value=hz(m);o.detune.value=cents;f.type='lowpass';f.frequency.setValueAtTime(260,t);f.frequency.linearRampToValueAtTime(1100,t+.22);f.frequency.linearRampToValueAtTime(520,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.16);g.gain.setValueAtTime(v,t+d-.25);g.gain.linearRampToValueAtTime(.0001,t+d);o.connect(f);f.connect(g);g.connect(A.bus);o.start(t);o.stop(t+d+.02)}))}
function horn(t,m,d,v){const c=A.ctx,o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(hz(m)*.97,t);o.frequency.linearRampToValueAtTime(hz(m),t+.06);l.frequency.value=5.2;lg.gain.value=4;l.connect(lg);lg.connect(o.frequency);f.type='lowpass';f.frequency.setValueAtTime(700,t);f.frequency.linearRampToValueAtTime(2300,t+.08);f.frequency.linearRampToValueAtTime(1200,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.05);g.gain.setValueAtTime(v*.8,t+Math.max(.06,d-.08));g.gain.linearRampToValueAtTime(.0001,t+d);o.connect(f);f.connect(g);g.connect(A.bus);o.start(t);l.start(t);o.stop(t+d+.02);l.stop(t+d+.02)}
const CHORDS=[[50,57,62],[48,55,60],[46,53,58],[45,52,61]];
const FANFARE={0:[69,2],3:[69,1],4:[74,4],8:[72,3],11:[69,1],12:[67,4],16:[70,3],19:[69,1],20:[65,4],24:[69,3],27:[76,1],28:[73,4]};
const CALM=[62,0,65,0,69,0,0,67,65,0,62,0,60,0,0,0,62,0,69,0,70,0,69,0,67,0,65,0,62,0,0,0];
function sched(){const c=A.ctx;if(!c||c.state!=='running')return;
  while(A.next<c.currentTime+.3){const t=A.next,s=A.i++;
    if(A.mode==='test'){const k=s%16;if(k%3===0||k===14)drum(t,k===0?.9:.55);if(s%3===0){const m=CALM[(s/3)%32];if(m)pluck(t,m,.42)}A.next+=.24}
    else{const b=.34,k=s%32,bar=k%8;if(bar===0)brass(t,CHORDS[k/8],b*8-.05,.075);if(bar===0||bar===3||bar===4||bar===6)drum(t,bar===0?1:.65);if(bar===2||bar===6||bar===7)tap(t,.3);const f=FANFARE[k];if(f&&Math.floor(s/32)%2===0)horn(t,f[0],f[1]*b-.03,.2);A.next+=b}}}
function setMode(m){if(A.mode===m)return;A.mode=m;A.i=0;if(A.ctx)A.next=Math.max(A.next,A.ctx.currentTime+.05);musicLevel()}
function tone(f,t,d,type,v,to){const c=A.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime+t);if(to)o.frequency.exponentialRampToValueAtTime(to,c.currentTime+t+d);g.gain.setValueAtTime(.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(v,c.currentTime+t+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+d);o.connect(g);g.connect(A.sfx);o.start(c.currentTime+t);o.stop(c.currentTime+t+d+.02)}
const SFX={
 click(){tone(520,0,.05,'triangle',.5)},
 pick(){tone(392,0,.08,'triangle',.6,587)},
 ok(){[659,880,1319].forEach((f,i)=>tone(f,i*.09,.28,'triangle',.8))},
 bad(){tone(196,0,.2,'square',.28);tone(147,.17,.38,'square',.28)},
 tick(){tone(1040,0,.05,'sine',.6)},
 timeup(){tone(494,0,.6,'sawtooth',.28,98)},
 win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.38,'triangle',.8));tone(1319,.5,.7,'triangle',.7)},
 rank(){[392,494,587].forEach((f,i)=>tone(f,i*.13,.34,'triangle',.65))}
};
function play(n){if(A.ctx&&A.on&&A.ctx.state==='running')SFX[n]()}
addEventListener('pointerdown',boot,true);addEventListener('keydown',boot,true);
document.addEventListener('visibilitychange',()=>{if(!A.ctx)return;document.hidden?A.ctx.suspend():A.ctx.resume()});
const duck=v=>{A.ducked=v;musicLevel()};
audio.addEventListener('play',()=>duck(true));audio.addEventListener('pause',()=>duck(false));audio.addEventListener('ended',()=>duck(false));
document.addEventListener('click',e=>{
  const s=e.target.closest('.snd');
  if(s){A.on=!A.on;try{localStorage.setItem('peh-snd',A.on?'1':'0')}catch(x){}if(A.ctx)A.master.gain.setTargetAtTime(A.on?1:0,A.ctx.currentTime,.05);s.innerHTML=SPK(A.on);s.setAttribute('aria-pressed',A.on);return}
  if(e.target.closest('.cta:not(:disabled)'))play('click');
  else if(e.target.closest('.who'))play('pick');
},true);
function go(h){gesture=true;if(location.hash!=='#'+h){skipHash=true;location.hash=h}route(h)}
function route(h){
  if(cleanup){cleanup();cleanup=null}
  h=h||location.hash.slice(1)||'inicio';const m=h.match(/^(audio|mision|prueba|respuesta|ranking)-(\d+)$/);let r;
  if(m){const n=+m[2],k=m[1];
   if(k==='audio'&&n>=1&&n<=17)r=n===1?V.inicio():V.audio(n);
   else if(k==='ranking'&&(n===1||n===2))r=V.ranking(n);
   else if(k!=='audio'&&k!=='ranking'&&n>=1&&n<=6)r=V[k](n-1);else r=V.inicio()}
  else if(h==='registro')r=V.registro();else r=V.inicio();
  cleanup=r||null;window.scrollTo(0,0);
}
addEventListener('hashchange',()=>{if(skipHash){skipHash=false;return}route()});
route();
